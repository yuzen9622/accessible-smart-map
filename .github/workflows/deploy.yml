name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing GHCR image tag to deploy (leave empty to build this commit)
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        (github.event_name != 'workflow_dispatch' || inputs.image_tag == '')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID }}
            NEXT_PUBLIC_END_POINT=${{ vars.NEXT_PUBLIC_END_POINT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs:
      - build
    if: >-
      ${{
        always() &&
        github.ref == 'refs/heads/main' &&
        (
          needs.build.result == 'success' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.image_tag != ''
          )
        )
      }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_TAG: ${{ inputs.image_tag || github.sha }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.repository_owner }}
      SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
      VM_DEPLOY_PATH: ${{ vars.VM_DEPLOY_PATH || 'taipei-accessible-map-deploy' }}
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_PORT: ${{ vars.VM_PORT || '22' }}
      VM_USER: ${{ secrets.VM_USER }}
    steps:
      - name: Check out deployment definition
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.VM_HOST }}

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ "$VM_PORT" =~ ^[0-9]+$ ]] || {
            echo "VM_PORT must be numeric" >&2
            exit 1
          }
          [[ "$VM_USER" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "VM_USER contains unsupported characters" >&2
            exit 1
          }
          [[ "$VM_HOST" =~ ^[A-Za-z0-9._:-]+$ ]] || {
            echo "VM_HOST contains unsupported characters" >&2
            exit 1
          }
          [[ "$VM_DEPLOY_PATH" =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo "VM_DEPLOY_PATH contains unsupported characters" >&2
            exit 1
          }
          [[ "$DEPLOY_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "image_tag contains unsupported characters" >&2
            exit 1
          }
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || {
            echo "VM_SSH_KEY and VM_KNOWN_HOSTS are required" >&2
            exit 1
          }

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Log VM in to GHCR
        if: ${{ env.GHCR_READ_TOKEN != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "GHCR_USERNAME contains unsupported characters" >&2
            exit 1
          }
          printf '%s' "$GHCR_READ_TOKEN" |
            ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
              -p "$VM_PORT" -i "$HOME/.ssh/deploy_key" \
              "${VM_USER}@${VM_HOST}" \
              "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Upload Compose definition
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -p "$VM_PORT" -i "$HOME/.ssh/deploy_key" \
            "${VM_USER}@${VM_HOST}" \
            "install -d -m 700 '$VM_DEPLOY_PATH'"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -p "$VM_PORT" -i "$HOME/.ssh/deploy_key" \
            "${VM_USER}@${VM_HOST}" \
            "cat > '$VM_DEPLOY_PATH/docker-compose.yml'" \
            < docker-compose.yml

      - name: Pull and restart services
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            -p "$VM_PORT" -i "$HOME/.ssh/deploy_key" \
            "${VM_USER}@${VM_HOST}" \
            "bash -se -- '$VM_DEPLOY_PATH' '$IMAGE_NAME' '$DEPLOY_TAG'" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          deploy_path=$1
          image_name=$2
          image_tag=$3

          cd "$deploy_path"
          export WEB_IMAGE="$image_name"
          export WEB_IMAGE_TAG="$image_tag"

          docker compose pull web
          docker compose up -d --no-build --remove-orphans --wait --wait-timeout 120
          docker compose ps
          REMOTE_SCRIPT
