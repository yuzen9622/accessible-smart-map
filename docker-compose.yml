services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/yuzen9622/taipei-accessible-map}:${WEB_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID}
        - NEXT_PUBLIC_END_POINT=${NEXT_PUBLIC_END_POINT}

    container_name: taipei-accessible-web
    restart: always

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      - NODE_ENV=production

    networks:
      - shared

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: frontend-cloudflare-tunnel
    restart: always

    command: tunnel --no-autoupdate run

    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}

    depends_on:
      - web

    networks:
      - shared

networks:
  shared:
    external: true
    name: accessible-shared